name: Verify repository contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  contracts-and-offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Documentation review gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_documentation.py "$BASE_SHA" "$HEAD_SHA"
      - name: Unit and offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Frozen history audit
        run: python -m gambling audit

  golden-replay:
    # Runs the archived scorers unchanged against hashed fixtures in the pinned model
    # environment. NCAABB_V4_20261101 needs the external reproducibility package and
    # reports SKIPPED in CI unless GOLDEN_EXTERNAL_DIR is provided.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned model environment
        run: python -m pip install -r requirements-models.txt
      - name: Golden replay fixtures
        run: python -m unittest tests.test_golden_replay -v

  modeldata:
    # Model-input store (migration 0006 in the rolling SQLite history) and golden-from-database proof.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned model environment
        run: python -m pip install -r requirements-models.txt pyarrow
      - name: Model-data tests and golden-from-database proof
        run: python -m unittest tests.test_modeldata -v
