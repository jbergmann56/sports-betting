name: Verify repository contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  contracts-and-offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Documentation review gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_documentation.py "$BASE_SHA" "$HEAD_SHA"
      - name: Unit and offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Frozen history audit
        run: python -m gambling audit
