[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gambling-research-offline"
version = "0.1.0"
description = "Offline migration and audit of frozen Gambling project evidence"
requires-python = ">=3.11"

[project.scripts]
gambling-research = "gambling.cli:main"

[tool.setuptools.packages.find]
include = ["gambling*"]
