[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gambling-research-offline"
version = "0.2.0"
description = "Frozen Gambling evidence, reliable Bovada odds capture, rolling SQLite history"
requires-python = ">=3.11"

[project.optional-dependencies]
# Legacy scorer / golden replay environment; exact lock in requirements-models.txt.
models = ["scikit-learn==1.8.0", "numpy==2.5.5", "pandas==3.1.1", "scipy==1.18.1", "joblib==1.6.0", "openpyxl>=3.1"]
parquet = ["pyarrow>=15"]

[project.scripts]
gambling-research = "gambling.cli:main"

[tool.setuptools.packages.find]
include = ["gambling*"]

[tool.setuptools.package-data]
"gambling.db" = ["migrations/*.sql"]
